commit-msg:
  jobs:
    - name: message
      run: node scripts/check-commit-message.ts {1}

pre-commit:
  parallel: true
  jobs:
    - name: format
      run: npm run format:check
    - name: lint
      run: npm run lint:check
    - name: types
      run: npm run types:check

pre-push:
  jobs:
    - name: test
      run: npm test
    - name: gate
      run: npm run gate
